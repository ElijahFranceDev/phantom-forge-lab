name: PhantomSync Forge Bridge Validate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: phantomsync-forge-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bridge syntax
        run: node --check server/bridge-bootstrap.js

      - name: Build frontend
        run: npm run build

      - name: Verify server still boots
        shell: bash
        env:
          OPENAI_API_KEY: test-key-for-startup-only
        run: |
          set -euo pipefail
          npm start > /tmp/phantomsync.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:5050/api/health || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/phantomsync.log
          exit 1
